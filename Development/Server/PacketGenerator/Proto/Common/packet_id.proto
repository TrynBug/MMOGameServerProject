syntax = "proto3";

package Common;

// 클라이언트 <-> 서버 패킷 ID
// 클라이언트(실제 유저)와 통신하는 모든 패킷을 여기에 정의한다.
enum GamePacketId {
    GAME_PACKET_ID_NONE = 0;

    // 100~199: 로그인 서버
    GAME_PACKET_ID_LOGIN_REQ = 101;   // 클라이언트 -> 로그인서버: 로그인 요청
    GAME_PACKET_ID_LOGIN_RES = 102;   // 로그인서버 -> 클라이언트: 로그인 결과

    // 200~299: 게임 접속 / 퇴장
    GAME_PACKET_ID_GATEWAY_AUTH_REQ = 200;           // 클라 -> 게이트웨이: 인증 요청 (게이트웨이 최초 접속 시)
    GAME_PACKET_ID_GAME_ENTER_NTF = 201;             // 게임서버 -> 클라: 게임 입장 완료 알림
    GAME_PACKET_ID_GAME_LOGOUT_REQ = 202;            // 클라 -> 게이트웨이: 게임 로그아웃 요청
    GAME_PACKET_ID_FORCE_DISCONNECT_NTF = 203;       // 게이트웨이 -> 클라: 강제 퇴장 알림
    GAME_PACKET_ID_GATEWAY_LATENCY_PROBE_REQ = 204;  // 클라 -> 게이트웨이: Gateway RTT 측정 요청
    GAME_PACKET_ID_GATEWAY_LATENCY_PROBE_RES = 205;  // 게이트웨이 -> 클라: Gateway RTT 측정 응답
    GAME_PACKET_ID_GAME_LATENCY_PROBE_REQ = 206;     // 클라 -> 게임서버: Gateway 경유 Game RTT 측정 요청
    GAME_PACKET_ID_GAME_LATENCY_PROBE_RES = 207;     // 게임서버 -> 클라: Gateway 경유 Game RTT 측정 응답

    // 300~399: 캐릭터 선택 / 생성
    GAME_PACKET_ID_CHARACTER_LIST_NTF = 301;          // 게임서버 -> 클라: 캐릭터 목록 알림 (입장 시 자동 전송)
    GAME_PACKET_ID_CHARACTER_CREATE_REQ = 302;        // 클라 -> 게임서버: 캐릭터 생성 요청
    GAME_PACKET_ID_CHARACTER_CREATE_RES = 303;        // 게임서버 -> 클라: 캐릭터 생성 결과
    GAME_PACKET_ID_CHARACTER_SELECT_REQ = 304;        // 클라 -> 게임서버: 캐릭터 선택 요청
    GAME_PACKET_ID_CHARACTER_SELECT_RES = 305;        // 게임서버 -> 클라: 캐릭터 선택 결과 (성공/실패 모두 포함)
    GAME_PACKET_ID_RETURN_TO_CHARACTER_SELECT_REQ = 306;  // 클라 -> 게임서버: 캐릭터 선택 화면으로 복귀 요청 (응답은 CharacterListNtf 재전송)

    // 1000~1999: 이동
    GAME_PACKET_ID_MOVE_INTENT_REQ = 1001;   // 클라 -> 서버: 이동 의도(MOVE_TO/STOP) + input_seq
    // 1002: 과거 MOVE_STOP_REQ 자리. MOVE_INTENT_REQ 로 통합되어 제거됨.
    // 1003: 과거 MOVE_NTF 자리. SNAPSHOT_NTF(1005) 스냅샷 스트리밍으로 대체되어 제거됨.
    GAME_PACKET_ID_MOVE_POS_CORRECT_NTF = 1004;   // 서버 -> 클라: 위치 보정 (클라 위치와 서버 위치가 너무 어깄났을 때)
    GAME_PACKET_ID_SNAPSHOT_NTF         = 1005;   // 서버 -> 클라: AOI 객체 상태 스냅샷 스트림 (매 tick 주기 송신. 이동 복제의 중심)
    GAME_PACKET_ID_TIME_SYNC_NTF        = 1006;   // 서버 -> 클라: NetClock 시각 동기 (저빈도 주기 push). SnapshotNtf 와 독립.
    GAME_PACKET_ID_ACTOR_ACTION_REQ     = 1007;   // 클라 -> 서버: 캐릭터 코스메틱 액션(점프/감정표현) 발생. 서버가 AOI relay.
    GAME_PACKET_ID_ACTOR_ACTION_NTF     = 1008;   // 서버 -> 클라(AOI): 캐릭터 코스메틱 액션. 관전자가 원격 캐릭터에 재생.

    // 2000~2999: 아이템
    GAME_PACKET_ID_ITEM_USE_REQ = 2001;   // 클라 -> 서버: 아이템 사용 요청
    GAME_PACKET_ID_ITEM_USE_RES = 2002;   // 서버 -> 클라: 아이템 사용 결과
    GAME_PACKET_ID_ITEM_PICKUP_REQ = 2003; // 클라 -> 서버: 근처 드롭 아이템 배치 습득 요청
    GAME_PACKET_ID_ITEM_PICKUP_RES = 2004; // 서버 -> 클라: 드롭별 습득 결과 + 변경된 인벤토리 아이템

    // 3000~3999: 채팅
    GAME_PACKET_ID_CHAT_SEND_REQ = 3001;   // 클라 -> 서버: 채팅 전송 요청
    GAME_PACKET_ID_CHAT_RECV_NTF = 3002;   // 서버 -> 클라: 채팅 수신 알림 (브로드캐스트)
    GAME_PACKET_ID_CHAT_SEND_RES = 3003;   // 서버 -> 클라: 채팅 전송 결과

    // 4000~4999: Stage / 주변 캐릭터
    // 4001: 과거 STAGE_ENTER_NTF 자리. STAGE_LOAD_COMPLETE_RES로 통합되어 제거됨.
    GAME_PACKET_ID_STAGE_MOVE_REQ = 4002;                // 클라 -> 서버: Stage 이동 요청 (동일/크로스 서버 통합. 서버가 분기)
    // 4003: 과거 CROSS_SERVER_STAGE_MOVE_REQ 자리. STAGE_MOVE_REQ로 통합되어 제거됨.
    // 4004, 4005: 과거 CHARACTER_ENTER_NTF / CHARACTER_LEAVE_NTF 자리. ObjectVisibilityNtf로 통합되어 제거됨.
    GAME_PACKET_ID_OBJECT_VISIBILITY_NTF = 4006;   // 서버 -> 클라: 오브젝트 가시성 변경 (생성/제거 리스트)
    GAME_PACKET_ID_OBJECT_DEATH_NTF      = 4007;   // 서버 -> 클라: 오브젝트 사망 알림 (사망 연출용). 디스폰은 ObjectVisibilityNtf 의 despawn_ids 로 별도 통보.
    GAME_PACKET_ID_STAGE_MOVE_RES = 4008;          // 서버 -> 클라: Stage 이동 요청 결과 (성공 = 클라 로딩 시작)
    GAME_PACKET_ID_STAGE_LOAD_COMPLETE_REQ = 4009; // 클라 -> 서버: 맵 로딩 완료 보고 (서버는 이때 스폰)
    GAME_PACKET_ID_STAGE_LOAD_COMPLETE_RES = 4010; // 서버 -> 클라: 입장 처리 완료 + 캐릭터 스폰 확정 (위치/방향 포함)
    GAME_PACKET_ID_STAGE_NOTICE_NTF        = 4011; // 서버 -> 클라: Stage 공지 배너 (스크립트 Notice())
    GAME_PACKET_ID_EVENT_AREA_ENTER_REQ    = 4012; // 클라 -> 서버: 이벤트영역 진입 선보고 (서버가 권위 위치로 검증 후 트리거)
    GAME_PACKET_ID_EVENT_AREA_EXIT_REQ     = 4013; // 클라 -> 서버: 이벤트영역 이탈 선보고
    GAME_PACKET_ID_OBJECT_INTERACT_REQ     = 4014; // 클라 -> 서버: 오브젝트(prop) 상호작용 요청 (근접+키, 서버가 위치 검증 후 상태전이/OnObjectInteract)
    GAME_PACKET_ID_PROP_STATE_NTF          = 4015; // 서버 -> 클라: prop 상태 변경 알림 (상호작용/스크립트로 상태 전이 시 AOI broadcast)
    GAME_PACKET_ID_OBJECT_REVIVE_NTF       = 4016; // 서버 -> 클라: 오브젝트 부활 알림 (사망 해제 + 위치/자원 복원 + 애니 복귀). ObjectDeathNtf 의 짝.
    GAME_PACKET_ID_OBJECT_INTERACT_RES     = 4017; // 서버 -> 클라: prop 상호작용 요청 결과 (실패 사유 전달. 성공 시 상태변화는 PropStateNtf, 포탈이동은 StageMoveRes 로 별도 통보)

    // 5000~5999: 던전
    GAME_PACKET_ID_PUBLIC_DUNGEON_LIST_REQ  = 5001;   // 클라 -> 서버: 공용던전 목록 요청
    GAME_PACKET_ID_PUBLIC_DUNGEON_LIST_RES  = 5002;   // 서버 -> 클라: 공용던전 목록 응답
    GAME_PACKET_ID_PUBLIC_DUNGEON_ENTER_REQ = 5003;   // 클라 -> 서버: 공용던전 입장 요청
    GAME_PACKET_ID_DUNGEON_ENTER_RES = 5004;          // 서버 -> 클라: 던전 입장 결과 (공용/유저 공통)
    GAME_PACKET_ID_USER_DUNGEON_CREATE_REQ  = 5005;   // 클라 -> 서버: 유저던전 생성 요청
    GAME_PACKET_ID_USER_DUNGEON_CREATE_RES  = 5006;   // 서버 -> 클라: 유저던전 생성 결과
    GAME_PACKET_ID_USER_DUNGEON_CLOSE_REQ = 5007;     // 클라 -> 서버: 유저던전 닫기 요청
    GAME_PACKET_ID_DUNGEON_CLOSED_NTF = 5008;   // 서버 -> 클라: 던전 종료 알림 (브로드캐스트)

    // 6000~6999: 스탯
    GAME_PACKET_ID_STAT_UPDATE_NTF = 6001;   // 서버 -> 클라: 합성 스탯 스냅샷 (최대HP/MP, 이동속도, 공격속도 등. 0 아닌 항목만)
    GAME_PACKET_ID_HP_MP_NTF       = 6002;   // 서버 -> 클라: 현재 HP/MP (대미지/회복으로 자주 갱신되는 런타임 값)

    // 7000~7999: 버프
    GAME_PACKET_ID_BUFF_NTF        = 7001;   // 서버 -> 클라: 버프 추가/갱신 (upsert. UI 뱃지용. 스탯 효과는 StatUpdateNtf/HpMpNtf로 별도 전송)
    GAME_PACKET_ID_BUFF_REMOVE_NTF = 7002;   // 서버 -> 클라: 버프 제거

    // 8000~8999: 스킬
    GAME_PACKET_ID_SKILL_CAST_REQ           = 8001;   // 클라 -> 서버: 스킬 시전 요청
    GAME_PACKET_ID_SKILL_PROJECTILE_HIT_REQ = 8002;   // 클라 -> 서버: 투사체 hit 보고 (한 프레임 분량을 배치로 보냄)
    GAME_PACKET_ID_SKILL_CAST_NTF           = 8003;   // 서버 -> 클라: 시전 통보 (비주얼 재현 + 시전 클라에 effectId 전달)
    GAME_PACKET_ID_SKILL_DAMAGE_NTF         = 8004;   // 서버 -> 클라: 대미지 통보 (숫자 표시 / HP / 사망)
    GAME_PACKET_ID_SKILL_CAST_REJECT_NTF    = 8005;   // 서버 -> 클라: 시전 거부 (쿳타임/마나 부족 등. 5c 에서 사용)

    // 8100~8199: 능력(몬스터/NPC/엘리트) 시전 — AI 두뇌(FSM/BT) 공용
    GAME_PACKET_ID_ABILITY_CAST_NTF = 8101;   // 서버 -> 클라: 능력 시전 "시작" 통보(윈드업/텔레그래프). AOI 브로드캐스트.

    // 9000~9999: 치트 (개발용. 서버는 _DEBUG 빌드에서만 처리)
    GAME_PACKET_ID_CHEAT_REQ = 9001;   // 클라 -> 서버: 치트 실행 요청 (name + args)
    GAME_PACKET_ID_CHEAT_RES = 9002;   // 서버 -> 클라: 치트 실행 결과 (success + message)

    // 9100~9199: 디버그 UI (개발용. 서버는 _DEBUG 빌드에서만 처리. 구독은 치트(dbgstat/dbgmon)로 토글)
    GAME_PACKET_ID_DEBUG_STAT_NTF              = 9101;   // 서버 -> 클라: 선택 오브젝트의 (0 아닌) 전체 스탯 스냅샷 (구독 중 주기 push)
    GAME_PACKET_ID_DEBUG_MONSTER_POSITIONS_NTF = 9102;   // 서버 -> 클라: 내 캐릭터 주변 섹터(AOI)의 몬스터 서버 좌표 (구독 중 주기 push)
}

// 서버 <-> 서버 패킷 ID
// 서버끼리 통신하는 모든 패킷을 여기에 정의한다.
enum ServerPacketId {
    SERVER_PACKET_ID_NONE = 0;

    // 1~99: 공용 서버 간 핸드셰이크 (모든 서버 간 연결의 첫 패킷)
    SERVER_PACKET_ID_SERVER_HANDSHAKE_REQ = 1;   // Connector -> Listener: 자신의 serverType, serverId 전달
    SERVER_PACKET_ID_SERVER_HANDSHAKE_RES = 2;   // Listener -> Connector: 검증 결과 및 자신의 serverId 전달

    // 1000~1999: 유저 관련 (게이트웨이 <-> 게임서버)
    SERVER_PACKET_ID_USER_ENTER_NTF = 1001;            // 게이트웨이 -> 게임서버: 유저 입장 알림
    SERVER_PACKET_ID_USER_DISCONNECT_NTF = 1002;       // 게이트웨이 -> 게임서버: 유저 연결 끊김 알림
    SERVER_PACKET_ID_USER_REROUTE_NTF = 1003;          // 게이트웨이 -> 목적지 게임서버: 유저 재라우팅 알림

    // 1100~1199: 패킷 전달 (게이트웨이 -> 게임서버)
    SERVER_PACKET_ID_RELAY_BATCH_NTF = 1101;                      // 게이트웨이 -> 게임서버: 배치 패킷 전달

    // 1200~1299: 게임서버 간 유저 이동 (게임서버 <-> 게이트웨이)
    SERVER_PACKET_ID_USER_MOVE_TO_GAME_SERVER_REQ = 1201;        // 게임서버 -> 게이트웨이: 다른 게임서버로 유저 이동 요청
    SERVER_PACKET_ID_USER_MOVE_TO_GAME_SERVER_FAIL_NTF = 1202;   // 게이트웨이 -> 게임서버: 유저 이동 실패 알림
    SERVER_PACKET_ID_SET_CLIENT_LATENCY_REQ = 1203;             // 게임서버 -> 게이트웨이: 클라 연결 지연 시뮬레이션 설정 (개발용)

    // 2000~2999: 로그인 서버 관련
    SERVER_PACKET_ID_LOGIN_AUTH_TOKEN_NTF = 2001;          // 로그인서버 -> 게이트웨이: 인증 토큰 사전 전달
    SERVER_PACKET_ID_LOGIN_DUPLICATE_NTF = 2002;           // 로그인서버 -> 게이트웨이: 중복 로그인 알림

    // 3000~3999: CommunicationServer 관련 (게임서버 <-> CommunicationServer)
    SERVER_PACKET_ID_CHAT_BROADCAST_REQ = 3001;   // 게임서버 -> CommunicationServer: 채팅 브로드캐스트 요청
    SERVER_PACKET_ID_CHAT_BROADCAST_NTF = 3002;   // CommunicationServer -> 게임서버: 채팅 브로드캐스트 알림
    SERVER_PACKET_ID_CHAT_PRESENCE_NTF = 3003;    // 게임서버 -> CommunicationServer: InStage 캐릭터 presence 변경
    SERVER_PACKET_ID_WHISPER_REQ = 3004;          // 게임서버 -> CommunicationServer: 귓속말 라우팅 요청
    SERVER_PACKET_ID_WHISPER_NTF = 3005;          // CommunicationServer -> 게임서버: 귓속말 전달
    SERVER_PACKET_ID_WHISPER_RES = 3006;          // CommunicationServer -> 게임서버: 귓속말 라우팅 결과

    // 9000~9999: 레지스트리 서버 관련
    SERVER_PACKET_ID_REGISTRY_REGISTER_REQ = 9001;       // 서버 -> 레지스트리: 등록 요청
    SERVER_PACKET_ID_REGISTRY_REGISTER_RES = 9002;       // 레지스트리 -> 서버: 등록 응답
    SERVER_PACKET_ID_REGISTRY_SERVER_INFO_NTF = 9003;    // 레지스트리 -> 서버: 다른 서버 정보 통보 (신규 등록 / 상태변경)
    SERVER_PACKET_ID_REGISTRY_POLL_REQ = 9004;           // 서버 -> 레지스트리: 서버 목록 폴링 요청
    SERVER_PACKET_ID_REGISTRY_POLL_RES = 9005;           // 레지스트리 -> 서버: 서버 목록 폴링 응답
    SERVER_PACKET_ID_REGISTRY_HEARTBEAT_REQ = 9006;      // 레지스트리 -> 서버: 하트비트 요청
    SERVER_PACKET_ID_REGISTRY_HEARTBEAT_RES = 9007;      // 서버 -> 레지스트리: 하트비트 응답
    SERVER_PACKET_ID_REGISTRY_USER_COUNT_NTF = 9008;     // 서버 -> 레지스트리: 접속자 수 보고
    SERVER_PACKET_ID_REGISTRY_SHUTDOWN_REQ = 9009;       // 서버 -> 레지스트리: Graceful Shutdown 시작 알림
}
