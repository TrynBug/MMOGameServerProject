syntax = "proto3";

package ServerPacket;

// 유저 입장 알림 (게이트웨이 -> 게임서버)
// 클라이언트가 인증 완료 후 게임서버로 전달됨
message GatewayUserEnterNtf {
    int64  user_id    = 1;
    int32  gateway_id = 2;   // 유저가 접속한 게이트웨이 ID
    string client_ip  = 3;
}

// 유저 연결 끊김 알림 (게이트웨이 -> 게임서버)
message GatewayUserDisconnectNtf {
    int64 user_id = 1;
}

// 유저를 다른 게임서버로 재라우팅 (게이트웨이 -> 목적지 게임서버)
// 게임서버가 UserMoveToGameServerReq를 보내면 게이트웨이가 목적지 게임서버에 전달
message GatewayUserRerouteNtf {
    int64 user_id        = 1;
    int32 gateway_id     = 2;
    int32 target_stage_id = 3;            // (크로스서버 이동에선 미사용)
    string client_ip     = 4;
    int64 character_id   = 5;             // 이동할 캐릭터 (목적지 서버가 DB 로드에 사용)
    int32 target_stage_data_key = 6;      // 목적지 Stage 데이터 키
    int32 position_type  = 7;             // EStagePositionType (도착 위치 타입)
}
