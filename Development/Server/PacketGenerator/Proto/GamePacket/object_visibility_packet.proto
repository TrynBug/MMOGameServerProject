syntax = "proto3";

package GamePacket;

// ──────────────────────────────────────────────
// 오브젝트 가시성 변경 알림
// ──────────────────────────────────────────────
//
// Stage 입장 시점, sector 이동 시점, 다른 유저의 입장/퇴장 시점 등에
// 클라이언트의 가시 범위에 들어오거나 나간 오브젝트를 일괄 통보한다.
//
// 클라이언트는 spawns 리스트의 각 항목을 자기 사전(또는 등가물)에 등록하고,
// despawn_ids 리스트의 id를 자기 사전에서 제거한다.
//
// idempotent 처리: 같은 object_id가 이미 사전에 있으면 정보를 갱신, 없으면 신규 생성.
// 자기 자신의 캐릭터도 spawns에 포함될 수 있다 (owner_account_id로 자기/남 구분).

// 가시 범위 진입 시 해당 오브젝트가 보유한 버프 1개 (UI 뱃지용).
// 스탯/HP 효과는 별도(StatUpdateNtf/HpMpNtf)로 전달되며, 여기는 표시 정보만 담는다.
message BuffSnapshotInfo {
    int32 buff_key       = 1;   // GameData_Buff 의 Key
    int32 stack_count    = 2;
    int32 remain_time_ms = 3;   // 남은 시간(ms). -1 = 영구(카운트다운 표시 안 함)
}

// 캐릭터 spawn 정보. 클라이언트가 화면에 캐릭터를 표시하는데 필요한 최소 정보.
// 좌표계: Unity 와 동일. Y가 높이, X-Z 가 평면.
message CharacterSpawnInfo {
    int64  object_id      = 1;   // = character_id
    int64  owner_account_id = 2;
    string name           = 3;
    int32  job_id         = 4;
    int32  level          = 5;
    double hp             = 6;   // 현재 HP
    double max_hp         = 7;   // 최대 HP(=HpTotal)
    double mp             = 8;   // 현재 MP
    double max_mp         = 9;   // 최대 MP(=MpTotal)
    float  pos_x          = 10;
    float  pos_y          = 11;  // 높이
    float  pos_z          = 12;  // 평면 깊이축
    float  yaw            = 13;  // Y축 회전, degree 단위
    repeated BuffSnapshotInfo buffs = 14;  // 현재 보유 버프 (UI 뱃지용)
    int32  appearance_preset_id = 15;  // 외형 프리셋 인덱스 (0-base). job_id 와 함께 외형 결정.
    bool   is_dead        = 16;  // 사망 상태. 부활 대기 중 시야 진입한 관전자가 사망 포즈로 표시한다. (MonsterSpawnInfo.is_dead 와 동일)
}

// 몬스터 spawn 정보. 클라이언트는 monster_key 로 몬스터 게임데이터를 조회해
// 프리팹 경로 등 나머지 정보를 얻는다.
// 좌표계: Unity 와 동일. Y가 높이, X-Z 가 평면.
message MonsterSpawnInfo {
    int64 object_id   = 1;
    int32 monster_key = 2;   // GameData_Monster 의 Key
    float pos_x       = 3;
    float pos_y       = 4;   // 높이
    float pos_z       = 5;   // 평면 깊이축
    float yaw         = 6;   // Y축 회전, degree 단위
    repeated BuffSnapshotInfo buffs = 7;   // 현재 보유 버프 (UI 뱃지용)
    bool is_dead = 8;                       // 사망(시체) 상태. corpse 유지 중 진입한 관전자가 사망 포즈로 표시한다.
    double cur_hp = 9;                      // 현재 HP. 살아있으면 max 와 같고, AOI 중간 진입/corpse 면 max 보다 작다(corpse=0).
    double max_hp = 10;                     // 최대 HP(=HpTotal). 클라가 HP바 계산의 분모로 쓴다.
}

// prop spawn 정보. 클라는 prop_key(종류)로 게임데이터를 조회해 프리팹 등을 얻고,
// state 로 초기 시각 상태를 맞춘다. prop 은 정적이라 위치 SnapshotNtf 에는 포함되지 않으며,
// 이후 상태 변경은 PropStateNtf 로만 전달된다.
// 좌표계: Unity 와 동일. Y가 높이, X-Z 가 평면.
message PropSpawnInfo {
    int64 object_id = 1;
    int32 prop_key  = 2;   // GameData_Prop 의 Key (= prop 종류/type)
    float pos_x     = 3;
    float pos_y     = 4;   // 높이
    float pos_z     = 5;   // 평면 깊이축
    float yaw       = 6;   // Y축 회전, degree 단위
    int32 state     = 7;   // 현재 상태값(진입 시점 시각 상태)
}

// 개인 소유 드롭 아이템 spawn 정보. 서버는 소유 캐릭터에게만 이 정보를 보낸다.
// pos는 서버 권위 착지 위치이며, 클라는 origin→pos 포물선 연출만 수행한다.
message DropSpawnInfo {
    int64 object_id = 1;
    int32 item_key = 2;                    // GameData_Item Key
    int32 count = 3;
    float origin_x = 4;
    float origin_y = 5;
    float origin_z = 6;
    float pos_x = 7;
    float pos_y = 8;
    float pos_z = 9;
    int64 created_server_time_ms = 10;
    int64 expire_server_time_ms = 11;
}

// 오브젝트 가시성 변경 알림 (서버 -> 클라)
// spawns: 보이게 된 오브젝트들 (타입별 리스트로 분리)
// despawn_ids: 안 보이게 된 오브젝트 ID 목록 (타입 무관, ID만)
message ObjectVisibilityNtf {
    repeated CharacterSpawnInfo character_spawns = 1;
    repeated MonsterSpawnInfo   monster_spawns   = 2;
    repeated PropSpawnInfo      prop_spawns      = 3;
    repeated DropSpawnInfo      drop_spawns      = 4;

    repeated int64 despawn_ids = 10;
}

// prop 상태 변경 알림 (서버 -> 클라)
// 상호작용/스크립트로 prop 상태가 전이된 시점에 주변 AOI 유저들에게 broadcast 한다.
// 클라는 object_id 로 prop 을 찾아 state 에 맞는 시각 상태(문 열림/레버 On 등)로 전환한다.
message PropStateNtf {
    int64 object_id       = 1;   // 상태가 바뀐 prop
    int32 state           = 2;   // 전이 후 상태값
    int64 actor_object_id = 3;   // 상호작용을 유발한 액터(없으면 0, 예: 스크립트 SetPropState)
}

// 오브젝트 사망 알림 (서버 -> 클라)
// HP 0 등으로 오브젝트가 사망한 시점에 주변 AOI 유저들에게 통보한다. 클라는 사망 애니메이션을 재생한다.
// 디스폰(시체 제거)은 일정 시간(corpse) 후 ObjectVisibilityNtf 의 despawn_ids 로 별도 통보된다.
// 대미지가 아닌 사인도 있을 수 있어 SkillDamageNtf 와 분리한다.
message ObjectDeathNtf {
    int64 object_id        = 1;   // 사망한 오브젝트
    int64 killer_object_id = 2;   // 처치자 (없으면 0)
}

// 오브젝트 부활 알림 (서버 -> 클라). ObjectDeathNtf 의 짝.
// 사망했던 오브젝트가 부활한 시점에 주변 AOI 유저들에게 통보한다.
message ObjectReviveNtf {
    int64  object_id = 1;   // 부활한 오브젝트
    float  pos_x     = 2;   // 부활 위치 (리스폰 지점일 수 있음)
    float  pos_y     = 3;   // 높이
    float  pos_z     = 4;   // 평면 깊이축
    float  yaw       = 5;   // Y축 회전, degree 단위
    double hp        = 6;   // 부활 후 현재 HP
    double mp        = 7;   // 부활 후 현재 MP
}
