syntax = "proto3";

package GamePacket;

// ──────────────────────────────────────────────
// 치트 패킷 (개발용)
// ──────────────────────────────────────────────
//
// 클라 치트 콘솔에서 입력한 명령 중, 등록된 "클라치트"가 아닌 것은 모두
// CheatReq 로 서버에 전송된다. 서버는 name 으로 핸들러를 찾아 처리하고
// CheatRes 로 결과 메시지를 돌려준다 (클라 콘솔에 그대로 표시).
//
// name 으로만 분기하므로 새 서버치트를 추가해도 이 proto 는 수정 불필요하다.
// (서버 핸들러 등록만 추가하면 된다.)
//
// 게이팅: 서버는 _DEBUG 빌드에서만 CheatReq 를 처리한다
//         (Stage 핸들러 테이블 등록이 _DEBUG 한정).

// 클라 -> 서버: 치트 실행 요청
message CheatReq {
    string name = 1;             // 치트 이름 (예: "ping")
    repeated string args = 2;    // 공백으로 분리된 인자들 (문자열 그대로)
}

// 서버 -> 클라: 치트 실행 결과
message CheatRes {
    bool   success = 1;
    string message = 2;          // 결과/에러 메시지 (콘솔에 그대로 표시)
}
