syntax = "proto3";

package GamePacket;

// ──────────────────────────────────────────────
// 이동 패킷
// ──────────────────────────────────────────────
//
// 흐름:
// - 클라가 좌클릭/홀드로 이동을 원하면 → MoveIntentReq(MOVE_TO, dest) 를 ~100ms 주기로 전송
// - 마우스를 떼면 → MoveIntentReq(STOP) 전송
// - 위치는 보내지 않는다(서버 권위). input_seq 로 클라 화해(reconciliation)를 정렬한다.
// - 서버는 매 tick 이동 시뮬 후 SnapshotNtf 로 권위 위치를 스트리밍한다.

enum EMoveIntent {
    MOVE_INTENT_NONE = 0;
    MOVE_INTENT_TO   = 1;   // dest 로 이동 시작/갱신
    MOVE_INTENT_STOP = 2;   // 즉시 정지
}

// 이동 의도 (클라 -> 서버). 위치는 보내지 않는다(서버 권위).
// input_seq: 클라 단조 증가 입력 번호. 서버가 SnapshotNtf.ack_input_seq 로 되돌려주어
//            클라가 "서버가 내 입력을 어디까지 반영했는지" 알고 예측을 화해(replay)한다.
message MoveIntentReq {
    uint32 input_seq      = 1;
    uint32 client_time_ms = 2;   // 클라 송신 시각(ms). 로깅/향후 RTT 추정용.
    EMoveIntent intent    = 3;
    float dest_x = 4;            // intent=MOVE_TO 일 때 목적지. 좌표계: Unity 동일(Y=높이, X-Z 평면).
    float dest_y = 5;
    float dest_z = 6;
    float yaw    = 7;            // 바라보는 방향 hint (권위 아님)
}

// ──────────────────────────────────────────────
// 캐릭터 코스메틱 액션 (점프 / 감정표현)
// ──────────────────────────────────────────────
// 게임 로직(위치/전투)과 무관한 시각 연출. 로컬은 즉시 재생하고 Req 를 보내며, 서버는 AOI 에 relay 만 한다.
// action_id: 1=Jump, 2=Emote. param: Emote 상태명(예: "Dance_1"), Jump 는 빈 문자열.

// 클라 -> 서버: 코스메틱 액션 발생 통보.
message ActorActionReq {
    int32  action_id = 1;
    string param     = 2;
}

// 서버 -> 클라(AOI): 어떤 액터가 코스메틱 액션을 했음. 관전자가 원격 캐릭터에 재생.
message ActorActionNtf {
    int64  actor_object_id = 1;
    int32  action_id       = 2;
    string param           = 3;
}

// (과거 MoveNtf 메시지 자리. SnapshotNtf 스냅샷 스트리밍으로 대체되어 제거됨.)

// 위치 보정 알림 (서버 -> 해당 클라만 unicast)
// 서버가 클라 위치와 서버 위치가 허용 오차를 초과한 것을 감지했을 때 전송.
// 클라는 이를 받으면 자신의 캐릭터를 서버 위치로 즉시 스냅하고,
// 진행 중이던 이동이 있다면 새 위치 기준으로 경로를 다시 계산하여 이어감.
// 좌표계: Unity 와 동일. yaw는 degree.
message MovePosCorrectNtf {
    float pos_x = 1;
    float pos_y = 2;             // 높이
    float pos_z = 3;             // 평면 깊이축
    float yaw   = 4;             // degree
}

// ──────────────────────────────────────────────
// 스냅샷 스트리밍 (서버 -> 클라, 매 tick 주기 송신)
// ──────────────────────────────────────────────
// 서버가 매 tick AOI 내 "이미 보이는" 오브젝트들의 권위 위치를 묶어 보낸다.
// spawn/despawn 은 ObjectVisibilityNtf 가 담당하고, 여기서는 transform 만 운반한다.
// 클라: 원격 액터는 스냅샷 사이를 보간(interpolation), 본인 캐릭터는 화해(reconciliation)에 사용한다.

// 오브젝트 1개의 현재 상태 (캐릭터/몬스터 공용. object_id 로 식별).
// 고빈도 패킷이라 위치/yaw 를 16bit 양자화해 fixed32 2개에 담는다(float 4개=20B → 10B).
// ★양자화 계약(서버 인코드 / 클라 디코드가 반드시 일치)★
//   X,Z : [-2048, 2048] 구간 16bit  (정밀도 ~6.25cm). 범위 밖은 클램프.
//   Y   : [-512, 512]   구간 16bit  (정밀도 ~1.6cm).
//   yaw : [0, 360)      구간 16bit.
//   원격 액터는 보간되고 화해 데드존(0.3u)이 양자화 오차(<0.07u)를 흡수하므로 시각/판정 영향 없음.
//   spawn/위치보정(CharacterSpawnInfo/MonsterSpawnInfo/MovePosCorrectNtf)은 full float 유지(저빈도·정밀).
message ActorStateInfo {
    int64   object_id  = 1;
    fixed32 qpos_xz    = 2;   // (qx<<16)|qz  : X,Z 16bit 양자화
    fixed32 qpos_y_yaw = 3;   // (qy<<16)|qyaw: Y 16bit, yaw 16bit
    uint32  flags      = 4;   // bit0=isMoving, bit1=isDead (애니메이션/보간 힌트)
}

// AOI 스냅샷 (서버 -> 해당 유저 unicast)
message SnapshotNtf {
    uint32 server_tick_seq = 1;          // 서버 단조 증가 tick 번호 (클라 보간 시계 기준)
    uint32 ack_input_seq   = 2;          // 이 유저의 마지막 처리된 MoveIntentReq.input_seq (클라 화해용)
    repeated ActorStateInfo states = 3;  // AOI 내 보이는 오브젝트들의 현재 상태
}

// ──────────────────────────────────────────────
// 시각 동기 (서버 -> 클라, 저빈도 주기 송신)
// ──────────────────────────────────────────────
// NetClock 재생 시계의 권위 앵커. server_tick_seq × 50ms = 서버시각.
// SnapshotNtf 와 독립적으로 stage 내 전 유저에게 저빈도(2Hz)로 broadcast 한다.
// → SnapshotNtf 가 0건이어도(혼자 유휴 등) 클라 시계가 굶지 않는다.
message TimeSyncNtf {
    uint32 server_tick_seq = 1;          // 현재 서버 tick (클라 NetClock 앵커)
}
