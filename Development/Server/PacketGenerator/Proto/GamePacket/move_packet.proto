syntax = "proto3";

package GamePacket;

// ──────────────────────────────────────────────
// 이동 패킷
// ──────────────────────────────────────────────
//
// 흐름 (클라이언트.md 참조):
// - 클라이언트가 마우스 좌클릭으로 땅을 찍으면 → MoveDestReq 전송 (목적지)
// - 마우스를 계속 누르고 있는 동안 화면을 따라 마우스가 움직이므로 약 500ms 마다 MoveDestReq 재전송
// - 마우스를 떼면 → MoveStopReq 전송 (현재 위치)
// - 서버는 매 tick 캐릭터를 직선 이동시키고, 목적지 도달 또는 정지 시 MoveNtf로 주변에 알린다.
// - 클라/서버 동기화 오차 검증은 향후 단계에서 추가.

// 목적지로 이동 시작/갱신 (클라 -> 서버)
// 캐릭터를 (dest_x, dest_y, dest_z)로 이동시켜달라는 요청.
// 좌표계: Unity 와 동일. Y는 높이, X-Z 가 평면.
// 이미 이동 중일 때 다시 받으면 목적지를 갱신한다.
// pos_x/y/z는 클라의 현재 위치. 서버가 이를 서버 위치와 비교하여 오차가 크면
// MovePosCorrectNtf를 보낸다. 서버 위치 자체는 이 요청으로 변경되지 않음.
message MoveDestReq {
    float dest_x = 1;
    float dest_y = 2;             // 높이
    float dest_z = 3;             // 평면 깊이축
    float pos_x  = 4;             // 클라 현재 위치 (검증용)
    float pos_y  = 5;             // 높이
    float pos_z  = 6;             // 평면 깊이축
}

// 즉시 정지 + 현재 위치 동기화 (클라 -> 서버)
// 캐릭터를 즉시 멈추고, 클라가 보낸 현재 위치를 서버 위치와 비교한다.
// 오차 범위 내면 클라 위치를 인정 (위치 보정 패킷은 향후 추가).
message MoveStopReq {
    float pos_x = 1;
    float pos_y = 2;             // 높이
    float yaw   = 3;             // degree
    float pos_z = 4;             // 평면 깊이축
}

// (과거 MoveNtf 메시지 자리. SnapshotNtf 스냅샷 스트리밍으로 대체되어 제거됨.)

// 위치 보정 알림 (서버 -> 해당 클라만 unicast)
// 서버가 클라 위치와 서버 위치가 허용 오차를 초과한 것을 감지했을 때 전송.
// 클라는 이를 받으면 자신의 캐릭터를 서버 위치로 즉시 스냅하고,
// 진행 중이던 이동이 있다면 새 위치 기준으로 경로를 다시 계산하여 이어감.
// 좌표계: Unity 와 동일. yaw는 degree.
message MovePosCorrectNtf {
    float pos_x = 1;
    float pos_y = 2;             // 높이
    float pos_z = 3;             // 평면 깊이축
    float yaw   = 4;             // degree
}

// ──────────────────────────────────────────────
// 스냅샷 스트리밍 (서버 -> 클라, 매 tick 주기 송신)
// ──────────────────────────────────────────────
// 서버가 매 tick AOI 내 "이미 보이는" 오브젝트들의 권위 위치를 묶어 보낸다.
// spawn/despawn 은 ObjectVisibilityNtf 가 담당하고, 여기서는 transform 만 운반한다.
// 클라: 원격 액터는 스냅샷 사이를 보간(interpolation), 본인 캐릭터는 화해(reconciliation)에 사용한다.

// 오브젝트 1개의 현재 상태 (캐릭터/몬스터 공용. object_id 로 식별).
message ActorStateInfo {
    int64  object_id = 1;
    float  pos_x = 2;
    float  pos_y = 3;            // 높이
    float  pos_z = 4;            // 평면 깊이축
    float  yaw   = 5;            // degree
    uint32 flags = 6;            // bit0=isMoving, bit1=isDead (애니메이션/보간 힌트)
}

// AOI 스냅샷 (서버 -> 해당 유저 unicast)
message SnapshotNtf {
    uint32 server_tick_seq = 1;          // 서버 단조 증가 tick 번호 (클라 보간 시계 기준)
    uint32 ack_input_seq   = 2;          // 이 유저의 마지막 처리된 입력 seq (화해용. Phase 3 전까지 0)
    repeated ActorStateInfo states = 3;  // AOI 내 보이는 오브젝트들의 현재 상태
}
