syntax = "proto3";

package GamePacket;

// ──────────────────────────────────────────────
// 게임 접속 / 퇴장 패킷 (클라이언트 <-> 게이트웨이/게임서버)
// ──────────────────────────────────────────────

// 게이트웨이 인증 요청 (클라 -> 게이트웨이)
// 로그인서버로부터 받은 accountId와 authToken을 게이트웨이에 전달하여 인증
message GatewayAuthReq {
    int64  account_id = 1;
    uint64 auth_token = 2;
}

// 게임 입장 완료 알림 (게임서버 -> 클라)
// 게이트웨이 인증 후 게임서버가 User 객체를 생성하고 SystemStage에 배정완료 됐을 때 전송.
// 이 시점에서 클라이언트는 캐릭터 선택 단계에 있다. 따라서 캐릭터 데이터는 포함되지 않고,
// 캐릭터 목록은 별도의 CharacterListNtf로 바로 이어서 전송된다.
// 실제 게임 플레이용 Stage (Town 등) 입장 완료 알림은 StageEnterNtf로 별도 전송.
message GameEnterNtf {
    int64 stage_id = 1;   // 입장한 Stage ID (현재는 SystemStage)
    int32 stage_key = 2;  // 입장한 Stage 데이터 Key
}

// 게임 로그아웃 요청 (클라 -> 게이트웨이)
// 클라이언트가 정상적으로 게임을 종료할 때 전송
message GameLogoutReq {
}

// 테스트 A용 RTT 측정. sequence는 요청과 응답을 짝짓는 용도로만 사용한다.
message LatencyProbeReq {
    uint64 sequence = 1;
}

message LatencyProbeRes {
    uint64 sequence = 1;
}

// 강제 퇴장 알림 (게이트웨이 -> 클라)
// 서버가 클라이언트 연결을 끊기 직전에 전송. 클라는 이유를 표시하고 연결 종료
message ForceDisconnectNtf {
    int32 reason_code = 1;   // ForceDisconnectReason 값
    string message = 2;   // 선택적 메시지 (빈 문자열 가능)
}

// 강제 퇴장 사유 코드
enum ForceDisconnectReason {
    FORCE_DISCONNECT_REASON_NONE = 0;
    FORCE_DISCONNECT_REASON_DUPLICATE_LOGIN = 1;   // 중복 로그인
    FORCE_DISCONNECT_REASON_SERVER_SHUTDOWN = 2;   // 서버 종료
    FORCE_DISCONNECT_REASON_AUTH_FAILED = 3;   // 인증 실패
    FORCE_DISCONNECT_REASON_KICKED = 4;   // 관리자 강퇴
}
