syntax = "proto3";

package GamePacket;

import "DataStructures/character.proto";

// ──────────────────────────────────────────────
// 캐릭터 선택 / 생성 패킷 (클라이언트 <-> 게임서버)
// ──────────────────────────────────────────────
//
// 입장 흐름:
//   1) 클라이언트가 게임서버에 입장하면 게임서버가 자동으로 CharacterListNtf 전송
//   2) 클라이언트는 캐릭터가 있으면 CharacterSelectReq, 없으면 CharacterCreateReq 전송
//   3) CharacterCreateReq에 대해 CharacterCreateRes 응답 → 클라이언트는 다시 CharacterSelectReq
//   4) CharacterSelectReq에 대해 CharacterSelectRes 응답 (성공/실패 모두 포함)

// 캐릭터 목록 알림 (게임서버 -> 클라)
// 유저가 게임서버에 입장하면 게임서버가 자동으로 전송한다.
// 목록이 비어있으면 클라이언트가 캐릭터 생성으로 진행한다.
message CharacterListNtf {
    repeated DataStructures.Character characters = 1;
}

// 캐릭터 생성 요청 (클라 -> 게임서버)
message CharacterCreateReq {
    string name = 1;     // 캐릭터 이름
    int32 job_id = 2;    // 직업 ID (GameData로 관리)
    int32 appearance_preset_id = 3;  // 외형 프리셋 인덱스 (0-base)
}

// 캐릭터 생성 결과 (게임서버 -> 클라)
// result_code 는 EResultCode (1=Success, 2=Fail). 0은 사용하지 않음.
message CharacterCreateRes {
    int32 result_code = 1;                          // EResultCode 값
    string error_msg = 2;                           // 실패 시 사유 메시지 (성공 시 빈 문자열)
    DataStructures.Character new_character = 3;     // 성공 시 생성된 캐릭터 (실패 시 비어있음)
}

// 캐릭터 선택 요청 (클라 -> 게임서버)
// 서버는 CharacterSelectRes로 응답한다 (성공/실패 모두).
message CharacterSelectReq {
    int64 character_id = 1;
}

// 캐릭터 선택 결과 (게임서버 -> 클라)
// result_code 는 EResultCode (1=Success, 2=Fail). 0은 사용하지 않음.
//
// 성공 시: 클라는 character(전체 데이터)로 LocalPlayer 데이터모델을 만들어 보관하고,
//          Game 씬 전환 + 맵 로딩을 시작한다. 완료 후 StageLoadCompleteReq를 보낸다.
//          spawn 위치/방향은 이후 StageLoadCompleteRes로 전달된다 (좌표 정보의 단일 출처).
//          클라는 이 캐릭터를 스테이지 이동마다 새로 만들지 않고 계속 보관한다(데이터 영속).
// 실패 시: error_msg 만 의미 있음.
message CharacterSelectRes {
    reserved 3, 4 to 8;          // 3: 과거 character_id(이제 character에 포함). 4-8: 과거 spawn 좌표.
    int32 result_code = 1;       // EResultCode 값
    string error_msg = 2;        // 실패 시 사유 메시지 (성공 시 빈 문자열)
    DataStructures.Character character = 10;  // 선택된 캐릭터 전체 데이터 (서버가 진실의 원천)
    int32 stage_data_key = 9;    // 입장할 Stage 데이터 Key (클라가 로딩할 맵 리소스 식별)
}

// 게임 중 캐릭터 선택 화면으로 복귀 요청 (클라 -> 게임서버)
// 서버는 현재 Stage 에서 퇴장 → SystemStage 복귀 후 CharacterListNtf 를 재전송한다.
// (별도 Res 없이 CharacterListNtf 수신이 성공 신호. 클라는 받으면 CharacterSelection 씬으로 전환)
message ReturnToCharacterSelectReq {
}
