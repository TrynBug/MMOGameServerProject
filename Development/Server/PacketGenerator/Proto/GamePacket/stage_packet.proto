syntax = "proto3";

package GamePacket;

import "Common/packet_id.proto";

// ──────────────────────────────────────────────
// Stage 이동
// ──────────────────────────────────────────────
//
// 이동 흐름 (2단계 입장):
//   1) 클라 -> 서버: StageMoveReq (대상 stageDataKey + 시작위치 타입)
//   2) 서버 -> 클라: StageMoveRes (성공 = 클라는 로딩 시작, 실패 = 사유 표시)
//   3) 클라 -> 서버: StageLoadCompleteReq (맵/NavMesh 로딩 완료 보고)
//   4) 서버 -> 클라: StageLoadCompleteRes (입장 처리 완료 + 캐릭터 스폰 확정. 위치/방향 포함)
// 최초 입장(캐릭터 선택 -> Town)도 2)~4) 와 동일한 시퀀스를 사용한다
// (2의 역할을 CharacterSelectRes가 대신함).

// Stage 이동 요청 (클라 -> 서버)
// 동일 게임서버 / 다른 게임서버 이동을 모두 이 패킷으로 요청한다 (서버가 분기).
message StageMoveReq {
    int32 target_stage_data_key = 1;   // 이동할 Stage 데이터 Key
    int32 position_type = 2;           // EStagePositionType 값 (도착 위치 선택)
                                       // [치트 전용 임시] 포탈 도입 시 서버가 통과한 포탈로부터 결정한다.
    int32 target_game_server_id = 3;   // 0 = 현재 서버. [치트 전용 임시] 타 서버 지정.
                                       // 장기적으로는 매칭/채널 시스템이 대상 서버를 해석한다.
}

// Stage 이동 요청 결과 (서버 -> 클라)
// result_code 는 EResultCode (1=Success, 2=Fail).
// 성공 수신 = 클라는 입력을 잠그고 맵 로딩을 시작한다.
// 크로스서버 이동 시에는 타겟 게임서버가 송신한다 (클라는 구분할 필요 없음).
message StageMoveRes {
    int32 result_code = 1;             // EResultCode 값
    string error_msg = 2;              // 실패 시 사유 (성공 시 빈 문자열)
    int32 target_stage_data_key = 3;   // 로딩할 Stage 데이터 Key
}

// Stage 로딩 완료 보고 (클라 -> 서버)
// 맵 프리팹/NavMesh 교체 완료 후 전송. 서버는 이 시점에 입장 처리(향후 인벤/스킬 로드 등) 후
// 캐릭터를 스폰하고 StageLoadCompleteRes로 응답한다.
message StageLoadCompleteReq {
}

// Stage 로딩 완료 결과 + 캐릭터 스폰 확정 (서버 -> 클라)
// result_code 는 EResultCode (1=Success, 2=Fail).
// 성공 시: 클라는 보유 중인 LocalPlayer를 spawn 위치에 배치하고 조작 가능 상태로 전환한다.
// 이 패킷 수신 전까지 클라는 '로딩 중'으로 캐릭터를 씬에 스폰하지 않는다.
// 주의: 캐릭터 데이터(스탯/인벤 등)는 이 패킷에 없다. 클라가 CharacterSelectRes로 이미 보유.
//       여기엔 이번 Stage에서의 spawn 좌표/식별 정보만 담는다.
message StageLoadCompleteRes {
    int32 result_code = 1;     // EResultCode 값
    string error_msg = 2;      // 실패 시 사유 (성공 시 빈 문자열)
    int64 stage_id = 3;        // Stage Id (런타임 발급)
    int32 stage_data_key = 4;  // Stage 데이터 Key
    float my_pos_x = 5;     // 서버가 결정한 내 spawn 위치
    float my_pos_y = 6;     // 높이
    float my_yaw   = 7;     // degree
    float my_pos_z = 8;     // 평면 깊이축
}
