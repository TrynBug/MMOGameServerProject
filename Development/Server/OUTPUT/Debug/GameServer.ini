# ────────────────────────────────────────────────────────────────
# GameServer.ini
# ────────────────────────────────────────────────────────────────
# ServerID 범위:
#   Registry  : 1
#   Login     : 10
#   Chat      : 20
#   Gateway   : 100~199
#   Game      : 200~899
#   (예비)    : 900~999

[Server]
Type    = Game
Id      = 201               # 200~899 범위
PrivateIP    = 127.0.0.1    # 서버간 내부통신 및 리슨소켓 bind 주소. AWS: 이 인스턴스의 프라이빗 IP
ClientPort   = -1           # (클라이언트 통신 없음)
InternalPort = 10201        # 서버 내부통신 포트

[Registry]
IP      = 127.0.0.1
Port    = 10001

# AccountDB: 계정/전역 DB + GameDBRegistry(샤드 목록) 보관. 값이 있으면 사용.
[AccountDB]
Host=127.0.0.1
Port=3306
User=root
Password=admin1234
DBName=accountdb

# GameDB: 캐릭터 샤드. Enabled=true 면 사용(AccountDB 필수).
# 샤드 host/port/db는 AccountDB의 GameDBRegistry에서 읽고, 접속 자격증명은 AccountDB와 공유.
[GameDB]
Enabled=true

[Network]
NumConcurrentThread = 2
NumWorkerThread     = 4
InitPacketSize      = 512
MaxPacketSize       = 65535
UserCountReportMs   = 10000

[Contents]
NumContentsThreads  = 0         # 0이면 CPU 코어 수 - 1로 자동 설정. 최소 1 이상 필요(오픈필드 0번 스레드).
ContentsUpdateMs    = 50

[Log]
Dir     = Logs
Level   = Debug     # Debug / Info / Warn / Error
