# ────────────────────────────────────────────────────────────────
# GatewayServer.ini
# ────────────────────────────────────────────────────────────────
# ServerID 범위:
#   Registry  : 1
#   Login     : 10
#   Chat      : 20
#   Gateway   : 100~199
#   Game      : 200~899
#   (예비)    : 900~999

[Server]
Type    = Gateway
Id      = 100          # 100~199 범위
# PrivateIP: 서버간 내부통신 및 리슨소켓 bind 주소. 반드시 구체적 IPv4(빈값/0.0.0.0/도메인명 불가).
#   로컬   : 127.0.0.1  /  AWS: 이 인스턴스의 프라이빗 IP (예: 172.31.x.x)
PrivateIP    = 127.0.0.1
# PublicIP: 클라이언트에게 광고하는 외부접속 주소. 게이트웨이는 필수(없으면 서버 미기동).
#   로컬   : 127.0.0.1  /  AWS: 이 인스턴스의 Elastic IP (인터넷 클라이언트가 접속하는 주소)
PublicIP     = 127.0.0.1
ClientPort   = 8101    # 클라이언트 통신 포트
InternalPort = 10100   # 서버 내부통신 포트

[Registry]
IP      = 127.0.0.1
Port    = 10001

[Network]
NumConcurrentThread = 2
NumWorkerThread     = 4
InitPacketSize      = 512
MaxPacketSize       = 65535
UserCountReportMs   = 10000

[Contents]
NumContentsThreads  = 1         # 컨텐츠 스레드 수
ContentsUpdateMs    = 50        # 컨텐츠 Update 주기 (ms)

[Monitoring]
Enabled = true
IP = 127.0.0.1
Port = 19100

[Log]
Dir     = Logs
Level   = Debug     # Debug / Info / Warn / Error
