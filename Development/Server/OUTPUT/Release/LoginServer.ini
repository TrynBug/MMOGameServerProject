# ────────────────────────────────────────────────────────────────
# LoginServer.ini
# ────────────────────────────────────────────────────────────────
# ServerID 범위:
#   Registry  : 1
#   Login     : 10
#   Chat      : 20
#   Gateway   : 100~199
#   Game      : 200~899
#   (예비)    : 900~999

[Server]
Type    = Login
Id      = 10
# PrivateIP: 서버간 내부통신 및 리슨소켓 bind 주소. 반드시 구체적 IPv4(빈값/0.0.0.0/도메인명 불가).
#   로컬   : 127.0.0.1
#   AWS    : 이 인스턴스의 프라이빗 IP (예: 172.31.x.x). 인터넷 클라이언트는 EIP→NAT로 이 소켓에 도달함
# (로그인서버는 클라이언트가 serverconfig.json으로 직접 접속하므로 PublicIP 불필요)
PrivateIP    = 127.0.0.1
ClientPort   = 8001    # 클라이언트 통신 포트
InternalPort = 10010   # 서버 내부통신 포트

[Registry]
IP      = 127.0.0.1
Port    = 10001

# AccountDB만 사용 (로그인 서버). 값이 있으면 사용.
[AccountDB]
Host=127.0.0.1
Port=3306
User=root
Password=admin1234
DBName=accountdb

[Network]
NumConcurrentThread = 2         # 0 = CPU 코어 수
NumWorkerThread     = 4         # 0 = CPU 코어 수 * 2
InitPacketSize      = 512
MaxPacketSize       = 65535

[Contents]
NumContentsThreads  = 1         # 컨텐츠 스레드 수
ContentsUpdateMs    = 50        # 컨텐츠 Update 주기 (ms)

[Monitoring]
Enabled = true
IP = 127.0.0.1
Port = 19010

[Log]
Dir     = Logs
Level   = Debug                 # Debug / Info / Warn / Error
